name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    name: check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test (domain, no DOM)
        run: bun run test:domain

      - name: Test (frontend, jsdom)
        run: bun run test:ui

      - name: Build
        run: bun run build

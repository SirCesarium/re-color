map $uri $static_cache_control {
	# HTML, robots.txt, sitemap.xml, service-worker.js
	default								"no-cache, max-age=0, must-revalidate";
	# Hashed SvelteKit build assets
	~^/_app/							"public, max-age=31536000, immutable";
	~/(favicon\.svg|og\.png|og\.svg)$	"public, max-age=604800";
	~/manifest\.webmanifest$				"public, max-age=3600";
}

server {
	listen		80;
	listen		[::]:80;
	server_name	_;

	root		/usr/share/nginx/html;
	index		index.html;
	server_tokens	off;

	add_header	X-Content-Type-Options	"nosniff"	always;
	add_header	Referrer-Policy		"no-referrer"	always;
	add_header	X-Frame-Options		"DENY"		always;
	add_header	Cache-Control		$static_cache_control always;

	gzip			on;
	gzip_vary		on;
	gzip_comp_level		5;
	gzip_min_length		1024;
	gzip_types		text/plain text/css application/javascript application/json
				application/manifest+json application/xml image/svg+xml;

	location = /manifest.webmanifest {
		default_type	application/manifest+json;
		try_files	$uri =404;
	}

	# Dotfiles; .well-known stays reachable.
	location ~ /\.(?!well-known) {
		deny all;
	}

	# trailingSlash = 'always': /privacy → 301 → /privacy/ → /privacy/index.html
	location / {
		try_files $uri $uri/ =404;
	}
}
